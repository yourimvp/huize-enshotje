# Hosting op GitHub Pages; ondersteunt ook een eigen domein.
# Zet in de repo Settings → Pages de bron op "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build for the configured Pages domain
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx tsc --noEmit && npx vite build --base="${PAGES_BASE_PATH}/"
      # Zorgt dat /turf, /anys etc. ook werken als je ververst
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
