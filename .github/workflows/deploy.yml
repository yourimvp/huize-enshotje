# Bouwt de site bij elke push naar main en zet hem via SFTP op Strato.
# Zet in GitHub → Settings → Secrets and variables → Actions:
#   STRATO_HOST (bijv. ssh.strato.de), STRATO_USER (bijv. enshotje.nl), STRATO_PASSWORD
#   STRATO_PATH (map op de server, bijv. /enshotje)
name: Deploy naar Strato

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload via SFTP
        if: env.STRATO_HOST != ''
        run: |
          sudo apt-get install -y lftp
          lftp -u "$USER","$PASS" "sftp://$HOST" -e "set sftp:auto-confirm yes; mirror -R --delete --verbose dist/ $DEST; bye"
        env:
          HOST: ${{ secrets.STRATO_HOST }}
          USER: ${{ secrets.STRATO_USER }}
          PASS: ${{ secrets.STRATO_PASSWORD }}
          DEST: ${{ secrets.STRATO_PATH }}
